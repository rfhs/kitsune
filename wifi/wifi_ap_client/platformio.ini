; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  fastled/FastLED@3.10.3
; slower cpu means better battery life and slightly slower execution
board_build.f_cpu = 80000000L

; Flags for our own sources on every toolchain. -fhardened is not supported
; on these targets, so its parts that apply to firmware are spelled out:
; FORTIFY_SOURCE (newlib implements it), libstdc++ assertions, the strong
; stack protector and stack clash protection. PIE, RELRO, BIND_NOW and
; -fcf-protection are for hosted ELF and x86 and are left out. -flto is
; not possible: the platform links with ld directly and rejects LTO objects.
[flags]
common = -O3 -Wformat -Wformat-security -Werror=format-security -Werror=strict-aliasing -Werror=odr -Werror=lto-type-mismatch -D_FORTIFY_SOURCE=3 -D_GLIBCXX_ASSERTIONS -fstack-protector-strong -fstack-clash-protection
; Only GCC 14 (the pioarduino toolchain) has these
gcc14 = -Wstringop-overread -Werror=stringop-overread -ftrivial-auto-var-init=zero

; Platforms. Every board section names one. A bare "platform = espressif32"
; resolves to whichever espressif32 is installed, and the pioarduino fork
; is also named espressif32, so an unpinned board can get either core.
[platform]
; Official Espressif platform, Arduino core 2.x. Every board but the ESP32-C5.
espressif = espressif32@~6.7.0
; pioarduino fork, Arduino core 3.x. The only platform with the ESP32-C5.
; Pinned to a release, the "stable" URL changes contents. Bump it in its own PR.
pioarduino = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip

; difficulty. One flag per environment: the conference header has one block
; per flag and the shared headers refuse a build that sets two.
[difficulty]
easy = -D EASY
hard = -D HARD
fiveeasy = -D FIVEEASY
fivehard = -D FIVEHARD

; mode
[mode]
client = -D CLIENT
ap = -D AP=AP

; board defines
;  if you add a board remember to add the led pin to include/rfhsledmacros.h
[m5atom]
platform = ${platform.espressif}
board = m5stack-atom
[m5atoms3]
platform = ${platform.espressif}
board = m5stack-atoms3
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1
[m5stamps3]
platform = ${platform.espressif}
board = m5stack-stamps3
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1
[arduino_nano_esp32]
platform = ${platform.espressif}
board= arduino_nano_esp32
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1
[seeed-xiao-esp32c5]
platform = ${platform.pioarduino}
board = seeed_xiao_esp32c5
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; actual targets, four per board
[env:m5atom-easy-ap]
extends = m5atom
build_flags = ${difficulty.easy} ${mode.ap} ${flags.common}
[env:m5atom-easy-client]
extends = m5atom
build_flags = ${difficulty.easy} ${mode.client} ${flags.common}
[env:m5atom-hard-ap]
extends = m5atom
build_flags = ${difficulty.hard} ${mode.ap} ${flags.common}
[env:m5atom-hard-client]
extends = m5atom
build_flags = ${difficulty.hard} ${mode.client} ${flags.common}

[env:arduino-nano-esp32-easy-ap]
extends = arduino_nano_esp32
build_flags = ${difficulty.easy} ${mode.ap} ${arduino_nano_esp32.board_flags} ${flags.common}
[env:arduino-nano-esp32-easy-client]
extends = arduino_nano_esp32
build_flags = ${difficulty.easy} ${mode.client} ${arduino_nano_esp32.board_flags} ${flags.common}
[env:arduino-nano-esp32-hard-ap]
extends = arduino_nano_esp32
build_flags = ${difficulty.hard} ${mode.ap} ${arduino_nano_esp32.board_flags} ${flags.common}
[env:arduino-nano-esp32-hard-client]
extends = arduino_nano_esp32
build_flags = ${difficulty.hard} ${mode.client} ${arduino_nano_esp32.board_flags} ${flags.common}

[env:seeed-xiao-esp32c5-easy-ap]
extends = seeed-xiao-esp32c5
build_flags = ${difficulty.easy} ${mode.ap} ${seeed-xiao-esp32c5.board_flags} ${flags.common} ${flags.gcc14}
[env:seeed-xiao-esp32c5-fiveeasy-ap]
extends = seeed-xiao-esp32c5
build_flags = ${difficulty.fiveeasy} ${mode.ap} ${seeed-xiao-esp32c5.board_flags} ${flags.common} ${flags.gcc14}
[env:seeed-xiao-esp32c5-easy-client]
extends = seeed-xiao-esp32c5
build_flags = ${difficulty.easy} ${mode.client} ${seeed-xiao-esp32c5.board_flags} ${flags.common} ${flags.gcc14}
[env:seeed-xiao-esp32c5-hard-ap]
extends = seeed-xiao-esp32c5
build_flags = ${difficulty.hard} ${mode.ap} ${seeed-xiao-esp32c5.board_flags} ${flags.common} ${flags.gcc14}
[env:seeed-xiao-esp32c5-fivehard-ap]
extends = seeed-xiao-esp32c5
build_flags = ${difficulty.fivehard} ${mode.ap} ${seeed-xiao-esp32c5.board_flags} ${flags.common} ${flags.gcc14}
[env:seeed-xiao-esp32c5-hard-client]
extends = seeed-xiao-esp32c5
build_flags = ${difficulty.hard} ${mode.client} ${seeed-xiao-esp32c5.board_flags} ${flags.common} ${flags.gcc14}

[env:m5atoms3-easy-ap]
extends = m5atoms3
build_flags = ${difficulty.easy} ${mode.ap} ${m5atoms3.board_flags} ${flags.common}
[env:m5atoms3-easy-client]
extends = m5atoms3
build_flags = ${difficulty.easy} ${mode.client} ${m5atoms3.board_flags} ${flags.common}
[env:m5atoms3-hard-ap]
extends = m5atoms3
build_flags = ${difficulty.hard} ${mode.ap} ${m5atoms3.board_flags} ${flags.common}
[env:m5atoms3-hard-client]
extends = m5atoms3
build_flags = ${difficulty.hard} ${mode.client} ${m5atoms3.board_flags} ${flags.common}

[env:m5stamps3-easy-ap]
extends = m5stamps3
build_flags = ${difficulty.easy} ${mode.ap} ${m5stamps3.board_flags} ${flags.common}
[env:m5stamps3-easy-client]
extends = m5stamps3
build_flags = ${difficulty.easy} ${mode.client} ${m5stamps3.board_flags} ${flags.common}
[env:m5stamps3-hard-ap]
extends = m5stamps3
build_flags = ${difficulty.hard} ${mode.ap} ${m5stamps3.board_flags} ${flags.common}
[env:m5stamps3-hard-client]
extends = m5stamps3
build_flags = ${difficulty.hard} ${mode.client} ${m5stamps3.board_flags} ${flags.common}
