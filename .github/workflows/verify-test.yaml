name: Verify Test
on:
  pull_request:
    branches:
      - main
concurrency:
  group: verify-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-test:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup
      run: ./qa/setup
    - name: Verify Test
      run: ./qa/verify-test
