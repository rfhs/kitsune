; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; Newer uses NimBLE instead of Bluedroid, we should upgrade
platform = espressif32@~6.7.0 ; Forces core v2.x with Bluedroid
framework = arduino
monitor_speed = 115200
lib_deps =
  fastled/FastLED@3.10.3
; slower cpu means better battery life and slightly slower execution
board_build.f_cpu = 80000000L

; Flags for our own sources on every toolchain. -fhardened is not supported
; on these targets, so its parts that apply to firmware are spelled out:
; FORTIFY_SOURCE (newlib implements it), libstdc++ assertions, the strong
; stack protector and stack clash protection. PIE, RELRO, BIND_NOW and
; -fcf-protection are for hosted ELF and x86 and are left out. -flto is
; not possible: the platform links with ld directly and rejects LTO objects.
[flags]
common = -O3 -Wformat -Wformat-security -Werror=format-security -Werror=strict-aliasing -Werror=odr -Werror=lto-type-mismatch -D_FORTIFY_SOURCE=3 -D_GLIBCXX_ASSERTIONS -fstack-protector-strong -fstack-clash-protection

; difficulty settings
[difficulty]
easy = -D EASY
medium = -D MEDIUM
hard = -D HARD

; board defines
;  if you add a board remember to add the led pin to include/rfhsledmacros.h
[m5atom]
board = m5stack-atom
[m5atoms3]
board = m5stack-atoms3
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1
[m5stamps3]
board = m5stack-stamps3
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1
[arduino_nano_esp32]
board = arduino_nano_esp32
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; actual targets, three per board
[env:m5atom-easy]
extends = m5atom
build_flags = ${difficulty.easy} ${flags.common}
[env:m5atom-medium]
extends = m5atom
build_flags = ${difficulty.medium} ${flags.common}
[env:m5atom-hard]
extends = m5atom
build_flags = ${difficulty.hard} ${flags.common}

[env:m5atoms3-easy]
extends = m5atoms3
build_flags = ${m5atoms3.board_flags} ${difficulty.easy} ${flags.common}
[env:m5atoms3-medium]
extends = m5atoms3
build_flags = ${m5atoms3.board_flags} ${difficulty.medium} ${flags.common}
[env:m5atoms3-hard]
extends = m5atoms3
build_flags = ${m5atoms3.board_flags} ${difficulty.hard} ${flags.common}

[env:m5stamps3-easy]
extends = m5stamps3
build_flags = ${m5stamps3.board_flags} ${difficulty.easy} ${flags.common}
[env:m5stamps3-medium]
extends = m5stamps3
build_flags = ${m5stamps3.board_flags} ${difficulty.medium} ${flags.common}
[env:m5stamps3-hard]
extends = m5stamps3
build_flags = ${m5stamps3.board_flags} ${difficulty.hard} ${flags.common}

[env:arduino-nano-esp32-easy]
extends = arduino_nano_esp32
build_flags = ${arduino_nano_esp32.board_flags} ${difficulty.easy} ${flags.common}
[env:arduino-nano-esp32-medium]
extends = arduino_nano_esp32
build_flags = ${arduino_nano_esp32.board_flags} ${difficulty.medium} ${flags.common}
[env:arduino-nano-esp32-hard]
extends = arduino_nano_esp32
build_flags = ${arduino_nano_esp32.board_flags} ${difficulty.hard} ${flags.common}
